name: macOS checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install rendering dependency
        run: python -m pip install -r requirements.txt
      - name: Show toolchain
        run: swift --version
      - name: Hardware-free test suites
        run: python scripts/run_tests.py
      - name: Release build
        run: swift build -c release
      - name: Frame and packet checks
        run: swift run eink-core-tests
      - name: Package and verify development signature
        run: python tools/build_companion.py
